apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: project-hub-github-actions-deployer
  namespace: {{ .Values.application.namespace }}

rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - pods
      - services
      - serviceaccounts
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
      - secretstores
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: project-hub-github-actions-deployer
  namespace: {{ .Values.application.namespace }}

subjects:
  - kind: Group
    name: project-hub-deployer
    apiGroup: rbac.authorization.k8s.io

roleRef:
  kind: Role
  name: project-hub-github-actions-deployer
  apiGroup: rbac.authorization.k8s.io
